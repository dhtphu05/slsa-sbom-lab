name: Keyless Artifact Signing with Cosign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package release artifact
        run: |
          tar -czf release.tar.gz src pyproject.toml README.md LICENSE
          sha256sum release.tar.gz > release.tar.gz.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign artifact keylessly
        run: cosign sign-blob --yes --bundle release.tar.gz.sigstore.json release.tar.gz

      - name: Verify signed artifact
        run: >-
          cosign verify-blob release.tar.gz
          --bundle release.tar.gz.sigstore.json
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/cosign-sign.yml@${{ github.ref }}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload signed release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed-package
          path: |
            release.tar.gz
            release.tar.gz.sigstore.json
            release.tar.gz.sha256
